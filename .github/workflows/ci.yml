name: CI

# Merge gate. Inline copy of the org reusable workflow
# (soundcheck-capital/.github/.github/workflows/ci.yml): this repo is public and a
# public repo cannot call a workflow from the private .github repo. Keep in sync.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Detect scripts
        id: s
        run: node -e 'const s=require("./package.json").scripts||{};for(const k of ["lint","typecheck","test","build"])console.log(`${k}=${k in s}`)' >> "$GITHUB_OUTPUT"
      - name: Lint
        if: steps.s.outputs.lint == 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.s.outputs.typecheck == 'true'
        run: npm run typecheck
      - name: Test
        if: steps.s.outputs.test == 'true'
        run: npm test
      - name: Build
        if: steps.s.outputs.build == 'true'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
