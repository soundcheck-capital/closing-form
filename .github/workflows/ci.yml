name: CI

# Merge gate. The checks live in the org's reusable workflow (DEV_LOOP.md):
# npm ci, then lint / typecheck / test / build when each script exists.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: soundcheck-capital/.github/.github/workflows/ci.yml@main
    with:
      node-version: '22'
